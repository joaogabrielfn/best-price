<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${projectName}">BestPrice</title>
</head>

<body>
    <h1 th:text="${projectName}">BestPrice</h1>

    <p th:text="${description}">
        Compare peripheral prices and track their changes.
    </p>

    <section>
        <h2>Featured product</h2>

        <article>
            <h3 th:text="${product.name}">Product name</h3>
            <p th:text="${product.brand}">Brand</p>
            <p th:text="${product.category}">Category</p>

            <strong th:text="|R$ ${product.lowestPrice}|">
                R$ 0.00
            </strong>
        </article>
    </section>
</body>
</html>
